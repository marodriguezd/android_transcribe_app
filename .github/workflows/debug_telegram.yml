name: Debug APK → Telegram

on:
  push:
    branches:
      - main

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Fix gradle.properties for CI
      run: |
        # Remove local JDK path — CI uses JAVA_HOME from setup-java
        sed -i '/org.gradle.java.home/d' gradle.properties
        # Remove the local ARM64 aapt2 override — CI runners (x86_64) use
        # the aapt2 shipped from Maven (AGENTS.md §3)
        sed -i '/android.aapt2FromMavenOverride/d' gradle.properties

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      run: |
        sdkmanager --install "ndk;28.0.13004108"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Install CMake & Ninja
      run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Rust format check (hard gate)
      run: cargo fmt --all -- --check

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Check translations (i18n parity gate)
      run: python3 scripts/check_translations.py

    # IMPORTANT: keep the two invocations separate. `app/build.gradle.kts`
    # skips wiring cargoNdkBuild to preBuild whenever "test"/"lint" appears
    # in the task list (thermal protection); a combined
    # `testDebugUnitTest assembleDebug` would therefore assemble an APK
    # without the Rust .so and crash at launch.
    - name: Run unit tests (hard gate)
      run: ./gradlew testDebugUnitTest --stacktrace --info 2>&1 | tee gradle_test.log

    - name: Run performance & latency benchmarks (optimization gate)
      run: python3 scripts/bench_performance.py

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --info 2>&1 | tee gradle_build.log

    - name: Lint (hard gate)
      run: ./gradlew lintDebug

    # Debug APKs ship without the bundled GGUF, so this gate is a safe
    # no-op here (it only verifies *present* assets); running it keeps the
    # checkModels contract exercised on every push, not just release tags.
    - name: Verify bundled model hash (checkModels gate)
      run: ./gradlew checkModels

    - name: Extract Version Name
      id: version
      run: |
        VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | grep -oP '"[^"]*"' | tr -d '"')
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

    - name: Rename APK
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk \
           android_transcribe_app_v${{ env.VERSION_NAME }}-debug.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk-v${{ env.VERSION_NAME }}
        path: android_transcribe_app_v${{ env.VERSION_NAME }}-debug.apk

    - name: Send APK to Telegram
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        COMMIT_MSG=$(git log -1 --pretty=%s)
        COMMIT_SHA=$(git rev-parse --short HEAD)
        curl -s -F chat_id="$TELEGRAM_CHAT_ID" \
             -F document=@"android_transcribe_app_v${{ env.VERSION_NAME }}-debug.apk" \
             -F caption="🔧 Debug Build v${{ env.VERSION_NAME }} ($COMMIT_SHA)
        $COMMIT_MSG" \
             "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument"

    - name: Alert Workflow Failure to Telegram
      if: failure()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        MSG="🚨 CI Workflow Failed on commit $(git rev-parse --short HEAD):"$'\n'
        if [ -f gradle_build.log ]; then
          ERR=$(grep -E "(FAILURE:|ERROR:|FAILED|Exception|error:|cannot find symbol)" gradle_build.log | tail -8)
          MSG="${MSG}"$'\n'"[BUILD LOG]"$'\n'"${ERR}"
        elif [ -f gradle_test.log ]; then
          ERR=$(grep -E "(FAILURE:|ERROR:|FAILED|Exception|error:)" gradle_test.log | tail -8)
          MSG="${MSG}"$'\n'"[TEST LOG]"$'\n'"${ERR}"
        fi
        if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$MSG" || true
        fi
