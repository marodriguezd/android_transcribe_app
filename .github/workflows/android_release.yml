name: Build Debug APK

# Se activa en CADA push a cualquier rama
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix gradle.properties for CI
      run: |
        # Remove local JDK path — CI uses JAVA_HOME from setup-java
        sed -i '/org.gradle.java.home/d' gradle.properties

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      run: |
        sdkmanager --install "ndk;28.0.13004108"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
          transcribe-rs/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug

    - name: Rename APK with commit info
      run: |
        COMMIT_HASH=$(git rev-parse --short HEAD)
        BRANCH_NAME=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')
        cp app/build/outputs/apk/debug/app-debug.apk "android_transcribe_app-${BRANCH_NAME}-${COMMIT_HASH}-debug.apk"
        echo "APK_NAME=android_transcribe_app-${BRANCH_NAME}-${COMMIT_HASH}-debug.apk" >> $GITHUB_ENV

    - name: Upload Debug APK
      if: env.APK_NAME != ''
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-${{ github.ref_name }}
        path: ${{ env.APK_NAME }}

    - name: Send Telegram notification
      env:
        BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        STATUS_EMOJI: ${{ job.status == 'success' && '✅' || '❌' }}
        STATUS_TEXT: ${{ job.status == 'success' && 'completado' || 'falló' }}
        APKL: ${{ env.APK_NAME || '(no generado)' }}
      if: always() && env.BOT_TOKEN != '' && env.CHAT_ID != ''
      continue-on-error: true
      run: |
        printf '%s\n' \
          "📡 Build ${STATUS_TEXT} ${STATUS_EMOJI}" \
          "" \
          "• Rama: ${GITHUB_REF_NAME}" \
          "• Commit: ${GITHUB_SHA}" \
          "• APK: ${APKL}" \
          "• Artifact esperado: app-debug-${GITHUB_REF_NAME}" \
          "" \
          "🔗 Workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
          > /tmp/tg_msg.txt
        curl -sS --fail-with-body \
          "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
          -d chat_id="${CHAT_ID}" \
          -d disable_web_page_preview=true \
          --data-urlencode "text@/tmp/tg_msg.txt" \
          || echo "::warning::Telegram notification failed (build status unaffected)"

    - name: Write Step Summary
      if: always()
      run: |
        {
          echo "## &#128296; android_transcribe_app debug build"
          echo
          echo "- **Rama:** <code>${{ github.ref_name }}</code>"
          echo "- **Commit:** <code>${{ github.sha }}</code>"
          echo "- **Estado:** ${{ job.status == 'success' && '&#9989; OK' || '&#10060; FAIL' }}"
          echo "- **APK en disco:** <code>${APK_NAME:-no generado}</code>"
          echo "- **Artifact esperado:** <code>app-debug-${{ github.ref_name }}</code>"
          echo "- **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        } >> "$GITHUB_STEP_SUMMARY"