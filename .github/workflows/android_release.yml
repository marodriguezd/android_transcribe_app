name: Build Debug APK

# Se activa en CADA push a cualquier rama
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix gradle.properties for CI
      run: |
        # Remove local JDK path — CI uses JAVA_HOME from setup-java
        sed -i '/org.gradle.java.home/d' gradle.properties

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      run: |
        sdkmanager --install "ndk;28.0.13004108"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
          transcribe-rs/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug

    - name: Rename APK with commit info
      run: |
        COMMIT_HASH=$(git rev-parse --short HEAD)
        BRANCH_NAME=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')
        cp app/build/outputs/apk/debug/app-debug.apk "android_transcribe_app-${BRANCH_NAME}-${COMMIT_HASH}-debug.apk"
        echo "APK_NAME=android_transcribe_app-${BRANCH_NAME}-${COMMIT_HASH}-debug.apk" >> $GITHUB_ENV

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-${{ github.ref_name }}
        path: ${{ env.APK_NAME }}

    - name: Send Telegram notification
      if: always()
      uses: appleboy/telegram-action@0.1.1
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        disable_web_page_preview: true
        format: html
        message: |
          ${{ job.status == 'success' && '&#9989;' || '&#10060;' }} <b>Build ${{ job.status == 'success' && 'completado' || 'falló' }}</b>

          • <b>Rama:</b> ${{ github.ref_name }}
          • <b>Commit:</b> <a href="https://github.com/${{ github.repository }}/commit/${{ github.sha }}">${{ github.sha }}</a> - ${{ github.event.head_commit.message || 'sin mensaje' }}
          ${{ job.status == 'success' && format('• <b>APK:</b> {0}', env.APK_NAME) || '' }}

          &#128279; <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">Ver workflow</a>
          ${{ job.status == 'success' && format('&#128230; <a href="https://github.com/{0}/actions/runs/{1}/artifacts">Descargar APK</a>', github.repository, github.run_id) || '' }}