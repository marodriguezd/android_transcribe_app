name: Build Android App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix gradle.properties for CI
      run: |
        # Remove local JDK path — CI uses JAVA_HOME from setup-java
        sed -i '/org.gradle.java.home/d' gradle.properties
        # Remove the local ARM64 aapt2 override — CI runners (x86_64) use
        # the aapt2 shipped from Maven (AGENTS.md §3)
        sed -i '/android.aapt2FromMavenOverride/d' gradle.properties

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      run: |
        sdkmanager --install "ndk;28.0.13004108"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV
        echo "ANDROID_NDK=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV
        echo "NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV
        echo "CMAKE_ANDROID_NDK=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    # transcribe-cpp-sys compiles its C++ core (whisper.cpp/ggml) via CMake.
    # ubuntu-latest ships cmake/ninja, but install explicitly to be safe.
    - name: Install CMake & Ninja
      run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Rust format check (hard gate)
      run: cargo fmt --all -- --check

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "KEYSTORE_BASE64 secret is missing — cannot sign the release"; exit 1
        fi
        echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
        test -s release.keystore || { echo "KEYSTORE_BASE64 decoded to an empty keystore — cannot sign the release"; exit 1; }

    - name: Check translations (i18n parity gate)
      run: python3 scripts/check_translations.py

    - name: Run unit tests (hard gate)
      run: ./gradlew testDebugUnitTest

    - name: Run performance & latency benchmarks (optimization gate)
      run: python3 scripts/bench_performance.py

    - name: Compile Rust native libraries (cargo-ndk)
      run: |
        mkdir -p app/src/main/jniLibs/arm64-v8a
        TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
        export CC_aarch64_unknown_linux_android="$TOOLCHAIN/bin/aarch64-linux-android26-clang"
        export CXX_aarch64_unknown_linux_android="$TOOLCHAIN/bin/aarch64-linux-android26-clang++"
        export AR_aarch64_unknown_linux_android="$TOOLCHAIN/bin/llvm-ar"
        export CC_aarch64_linux_android="$TOOLCHAIN/bin/aarch64-linux-android26-clang"
        export CXX_aarch64_linux_android="$TOOLCHAIN/bin/aarch64-linux-android26-clang++"
        export AR_aarch64_linux_android="$TOOLCHAIN/bin/llvm-ar"
        export CC="$TOOLCHAIN/bin/aarch64-linux-android26-clang"
        export CXX="$TOOLCHAIN/bin/aarch64-linux-android26-clang++"
        export AR="$TOOLCHAIN/bin/llvm-ar"
        export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
        export CMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
        export CMAKE_TOOLCHAIN_FILE_aarch64_linux_android="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
        export CMAKE_TOOLCHAIN_FILE_aarch64_unknown_linux_android="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
        export CARGO_NDK_PLATFORM="26"
        export RUSTFLAGS="-C target-feature=+neon,+fp16,+dotprod"
        export TRANSCRIBE_CMAKE_ARGS="-DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=26 -DANDROID_STL=c++_shared -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16 -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS_RELEASE=-O3 -DCMAKE_CXX_FLAGS_RELEASE=-O3 -DGGML_NATIVE=OFF -DGGML_BUILD_TESTS=OFF -DGGML_BUILD_EXAMPLES=OFF"
        cargo ndk -t arm64-v8a -o app/src/main/jniLibs build --release

    - name: Copy NDK libc++_shared.so
      run: |
        NDK_LIBCPP=$(find "$ANDROID_HOME/ndk/28.0.13004108" -name "libc++_shared.so" | grep -E "(aarch64|arm64-v8a)" | head -1)
        mkdir -p app/src/main/jniLibs/arm64-v8a
        if [ -n "$NDK_LIBCPP" ] && [ -f "$NDK_LIBCPP" ]; then
          cp "$NDK_LIBCPP" app/src/main/jniLibs/arm64-v8a/libc++_shared.so
          echo "Copied libc++_shared.so from: $NDK_LIBCPP"
        fi
        ls -la app/src/main/jniLibs/arm64-v8a/

    - name: Build Release APK
      env:
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASS: ${{ secrets.KEY_PASS }}
        STORE_PASS: ${{ secrets.STORE_PASS }}
      run: |
        ./gradlew assembleRelease

    - name: Verify bundled model hash (checkModels gate)
      run: ./gradlew checkModels

    # Guardrail: never publish an unsigned or misaligned APK. apksigner and
    # zipalign ship with the Android SDK build-tools installed by
    # setup-android. The release APK is signed by AGP's signingConfig, so
    # this must pass; a failure here aborts the job before the release is
    # created.
    - name: Verify APK alignment and signature
      run: |
        APK=app/build/outputs/apk/release/app-release.apk
        BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
        "$BT"zipalign -c 4 "$APK"
        "$BT"apksigner verify --print-certs "$APK" | tee apk-cert.txt
        grep -q 'CN=' apk-cert.txt || { echo "APK is not signed — aborting release"; exit 1; }

    - name: Extract Version Name
      id: extract_version
      run: |
        VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | grep -oP '"[^"]*"' | tr -d '"')
        echo "Detected Version: $VERSION_NAME"
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

    - name: Rename Artifacts
      run: |
        cp app/build/outputs/apk/release/app-release.apk Aura_Transcribe_v${{ env.VERSION_NAME }}.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aura-Transcribe-v${{ env.VERSION_NAME }}
        path: Aura_Transcribe_v${{ env.VERSION_NAME }}.apk

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v1
      with:
        name: Aura Transcribe v${{ env.VERSION_NAME }}
        tag_name: v${{ env.VERSION_NAME }}
        # Release notes come from RELEASE_NOTES.md in the tagged commit.
        body_path: RELEASE_NOTES.md
        files: |
          Aura_Transcribe_v${{ env.VERSION_NAME }}.apk
