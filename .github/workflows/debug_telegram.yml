name: Debug APK → Telegram

on:
  push:
    branches:
      - main
      - 'feat/**'

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Fix gradle.properties for CI
      run: |
        # Remove local JDK path — CI uses JAVA_HOME from setup-java
        sed -i '/org.gradle.java.home/d' gradle.properties
        # Remove the local ARM64 aapt2 override — CI runners (x86_64) use
        # the aapt2 shipped from Maven (AGENTS.md §3)
        sed -i '/android.aapt2FromMavenOverride/d' gradle.properties

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      run: |
        sdkmanager --install "ndk;28.0.13004108"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Install CMake & Ninja
      run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Rust format check (hard gate)
      run: cargo fmt --all -- --check

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Check translations (i18n parity gate)
      run: python3 scripts/check_translations.py

    # IMPORTANT: keep the two invocations separate. `app/build.gradle.kts`
    # skips wiring cargoNdkBuild to preBuild whenever "test"/"lint" appears
    # in the task list (thermal protection); a combined
    # `testDebugUnitTest assembleDebug` would therefore assemble an APK
    # without the Rust .so and crash at launch.
    - name: Run unit tests (hard gate)
      run: ./gradlew testDebugUnitTest --stacktrace --info 2>&1 | tee gradle_test.log

    - name: Run performance & latency benchmarks (optimization gate)
      run: python3 scripts/bench_performance.py

    - name: Compile Rust native libraries (cargo-ndk)
      run: |
        mkdir -p app/src/main/jniLibs/arm64-v8a
        export PATH="$HOME/.cargo/bin:$PATH"
        export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
        export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.0.13004108"
        export ANDROID_NDK="$ANDROID_HOME/ndk/28.0.13004108"
        export CMAKE_ANDROID_NDK="$ANDROID_HOME/ndk/28.0.13004108"
        export NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
        export CMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.0.13004108/build/cmake/android.toolchain.cmake"
        export CMAKE_TOOLCHAIN_FILE_aarch64_linux_android="$ANDROID_HOME/ndk/28.0.13004108/build/cmake/android.toolchain.cmake"
        export CMAKE_TOOLCHAIN_FILE_aarch64-linux-android="$ANDROID_HOME/ndk/28.0.13004108/build/cmake/android.toolchain.cmake"
        export CARGO_NDK_PLATFORM="26"
        export RUSTFLAGS="-C target-feature=+neon,+fp16,+dotprod"
        export TRANSCRIBE_CMAKE_ARGS="-DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16 -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS_RELEASE=-O3 -DCMAKE_CXX_FLAGS_RELEASE=-O3 -DGGML_NATIVE=OFF -DGGML_BUILD_TESTS=OFF -DGGML_BUILD_EXAMPLES=OFF -DANDROID_STL=c++_shared -DCMAKE_SYSTEM_VERSION=26 -DANDROID_PLATFORM=android-26 -DANDROID_ABI=arm64-v8a -DANDROID_NDK=$ANDROID_HOME/ndk/28.0.13004108 -DCMAKE_ANDROID_NDK=$ANDROID_HOME/ndk/28.0.13004108"
        set -e -o pipefail
        cargo ndk -t arm64-v8a -o app/src/main/jniLibs build --release 2>&1 | tee cargo_build.log

    - name: Copy NDK libc++_shared.so
      run: |
        NDK_LIBCPP=$(find "$ANDROID_HOME/ndk/28.0.13004108" -name "libc++_shared.so" | grep -E "(aarch64|arm64-v8a)" | head -1)
        mkdir -p app/src/main/jniLibs/arm64-v8a
        if [ -n "$NDK_LIBCPP" ] && [ -f "$NDK_LIBCPP" ]; then
          cp "$NDK_LIBCPP" app/src/main/jniLibs/arm64-v8a/libc++_shared.so
          echo "Copied libc++_shared.so from: $NDK_LIBCPP"
        fi
        ls -la app/src/main/jniLibs/arm64-v8a/

    - name: Build Debug APK
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        set -e -o pipefail
        ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle_build.log

    - name: Lint (hard gate)
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        set -e -o pipefail
        ./gradlew lintDebug --stacktrace 2>&1 | tee gradle_lint.log

    # Debug APKs ship without the bundled GGUF, so this gate is a safe
    # no-op here (it only verifies *present* assets); running it keeps the
    # checkModels contract exercised on every push, not just release tags.
    - name: Verify bundled model hash (checkModels gate)
      run: ./gradlew checkModels

    - name: Extract Version Name
      id: version
      run: |
        VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | grep -oP '"[^"]*"' | tr -d '"')
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

    - name: Rename APK
      run: |
        APK_SRC=$(find app/build -name "*debug*.apk" -o -name "*.apk" 2>/dev/null | grep -v "unaligned" | head -1)
        if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
          echo "ERROR: No APK found in app/build!"
          find app/build -type f || true
          exit 1
        fi
        echo "Found built APK at: $APK_SRC"
        cp "$APK_SRC" "Aura_Transcribe_v${{ env.VERSION_NAME }}-debug.apk"
        ls -lh "Aura_Transcribe_v${{ env.VERSION_NAME }}-debug.apk"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aura-Transcribe-v${{ env.VERSION_NAME }}-debug
        path: Aura_Transcribe_v${{ env.VERSION_NAME }}-debug.apk

    - name: Send APK to Telegram
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        COMMIT_MSG=$(git log -1 --pretty=%s)
        COMMIT_SHA=$(git rev-parse --short HEAD)
        curl -s -F chat_id="$TELEGRAM_CHAT_ID" \
             -F document=@"Aura_Transcribe_v${{ env.VERSION_NAME }}-debug.apk" \
             -F caption="✨ Aura Transcribe v${{ env.VERSION_NAME }} ($COMMIT_SHA)
        $COMMIT_MSG" \
             "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument"

    - name: Upload Build Logs on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failure-build-logs
        path: |
          *.log
          app/build/reports/

    - name: Alert Workflow Failure to Telegram
      if: failure()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        MSG="🚨 CI Workflow Failed on commit $(git rev-parse --short HEAD):"$'\n'
        if [ -f cargo_build.log ]; then
          ERR=$(tail -n 25 cargo_build.log)
          MSG="${MSG}"$'\n'"[CARGO LOG]"$'\n'"${ERR}"
        elif [ -f gradle_build.log ]; then
          ERR=$(tail -n 25 gradle_build.log)
          MSG="${MSG}"$'\n'"[BUILD LOG]"$'\n'"${ERR}"
        elif [ -f gradle_lint.log ]; then
          ERR=$(tail -n 25 gradle_lint.log)
          MSG="${MSG}"$'\n'"[LINT LOG]"$'\n'"${ERR}"
        elif [ -f gradle_test.log ]; then
          ERR=$(tail -n 25 gradle_test.log)
          MSG="${MSG}"$'\n'"[TEST LOG]"$'\n'"${ERR}"
        fi
        if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$MSG" || true
        fi
