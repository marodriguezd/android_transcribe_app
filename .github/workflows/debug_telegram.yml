name: Debug APK → Telegram

on:
  push:
    branches:
      - main
      - 'feat/**'

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Fix gradle.properties for CI
      run: |
        # Remove local JDK path — CI uses JAVA_HOME from setup-java
        sed -i '/org.gradle.java.home/d' gradle.properties
        # Remove the local ARM64 aapt2 override — CI runners (x86_64) use
        # the aapt2 shipped from Maven (AGENTS.md §3)
        sed -i '/android.aapt2FromMavenOverride/d' gradle.properties

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      run: |
        sdkmanager --install "ndk;28.0.13004108"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV
        echo "ANDROID_NDK=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV
        echo "NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV
        echo "CMAKE_ANDROID_NDK=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Install CMake & Ninja
      run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

    - name: Install cargo-ndk
      run: |
        cargo install cargo-ndk
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Rust format check (hard gate)
      run: cargo fmt --all -- --check

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Check translations (i18n parity gate)
      run: python3 scripts/check_translations.py

    # IMPORTANT: keep the two invocations separate. `app/build.gradle.kts`
    # skips wiring cargoNdkBuild to preBuild whenever "test"/"lint" appears
    # in the task list (thermal protection); a combined
    # `testDebugUnitTest assembleDebug` would therefore assemble an APK
    # without the Rust .so and crash at launch.
    - name: Run unit tests (hard gate)
      run: ./gradlew testDebugUnitTest --stacktrace --info 2>&1 | tee gradle_test.log

    - name: Run performance & latency benchmarks (optimization gate)
      run: python3 scripts/bench_performance.py

    - name: Compile Rust native libraries (cargo-ndk)
      run: |
        mkdir -p app/src/main/jniLibs/arm64-v8a
        TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
        export CC_aarch64_unknown_linux_android="$TOOLCHAIN/bin/aarch64-linux-android26-clang"
        export CXX_aarch64_unknown_linux_android="$TOOLCHAIN/bin/aarch64-linux-android26-clang++"
        export AR_aarch64_unknown_linux_android="$TOOLCHAIN/bin/llvm-ar"
        export CC_aarch64_linux_android="$TOOLCHAIN/bin/aarch64-linux-android26-clang"
        export CXX_aarch64_linux_android="$TOOLCHAIN/bin/aarch64-linux-android26-clang++"
        export AR_aarch64_linux_android="$TOOLCHAIN/bin/llvm-ar"
        export CC="$TOOLCHAIN/bin/aarch64-linux-android26-clang"
        export CXX="$TOOLCHAIN/bin/aarch64-linux-android26-clang++"
        export AR="$TOOLCHAIN/bin/llvm-ar"
        export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
        export CMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
        export CMAKE_TOOLCHAIN_FILE_aarch64_linux_android="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
        export CMAKE_TOOLCHAIN_FILE_aarch64_unknown_linux_android="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
        export CARGO_NDK_PLATFORM="26"
        export RUSTFLAGS="-C target-feature=+neon,+fp16,+dotprod"
        export TRANSCRIBE_CMAKE_ARGS="-DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=26 -DANDROID_STL=c++_shared -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16 -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS_RELEASE=-O3 -DCMAKE_CXX_FLAGS_RELEASE=-O3 -DGGML_NATIVE=OFF -DGGML_BUILD_TESTS=OFF -DGGML_BUILD_EXAMPLES=OFF"
        cargo ndk -t arm64-v8a -o app/src/main/jniLibs build --release 2>&1 | tee cargo_build.log

    - name: Copy NDK libc++_shared.so
      run: |
        NDK_LIBCPP=$(find "$ANDROID_HOME/ndk/28.0.13004108" -name "libc++_shared.so" | grep -E "(aarch64|arm64-v8a)" | head -1)
        mkdir -p app/src/main/jniLibs/arm64-v8a
        if [ -n "$NDK_LIBCPP" ] && [ -f "$NDK_LIBCPP" ]; then
          cp "$NDK_LIBCPP" app/src/main/jniLibs/arm64-v8a/libc++_shared.so
          echo "Copied libc++_shared.so from: $NDK_LIBCPP"
        fi
        ls -la app/src/main/jniLibs/arm64-v8a/

    - name: Build Debug APK
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        set -e -o pipefail
        ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle_build.log

    - name: Lint (hard gate)
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        set -e -o pipefail
        ./gradlew lintDebug --stacktrace 2>&1 | tee gradle_lint.log

    # Debug APKs ship without the bundled GGUF, so this gate is a safe
    # no-op here (it only verifies *present* assets); running it keeps the
    # checkModels contract exercised on every push, not just release tags.
    - name: Verify bundled model hash (checkModels gate)
      run: ./gradlew checkModels

    - name: Extract Version Name
      id: version
      run: |
        VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | grep -oP '"[^"]*"' | tr -d '"')
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

    - name: Rename APK
      run: |
        APK_SRC=$(find app/build -name "*debug*.apk" -o -name "*.apk" 2>/dev/null | grep -v "unaligned" | head -1)
        if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
          echo "ERROR: No APK found in app/build!"
          find app/build -type f || true
          exit 1
        fi
        echo "Found built APK at: $APK_SRC"
        cp "$APK_SRC" "Aura_Transcribe_v${{ env.VERSION_NAME }}-debug.apk"
        ls -lh "Aura_Transcribe_v${{ env.VERSION_NAME }}-debug.apk"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aura-Transcribe-v${{ env.VERSION_NAME }}-debug
        path: Aura_Transcribe_v${{ env.VERSION_NAME }}-debug.apk

    - name: Send APK to Telegram
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        COMMIT_MSG=$(git log -1 --pretty=%s)
        COMMIT_SHA=$(git rev-parse --short HEAD)
        curl -s -F chat_id="$TELEGRAM_CHAT_ID" \
             -F document=@"Aura_Transcribe_v${{ env.VERSION_NAME }}-debug.apk" \
             -F caption="✨ Aura Transcribe v${{ env.VERSION_NAME }} ($COMMIT_SHA)
        $COMMIT_MSG" \
             "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument"

    - name: Upload Build Logs on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failure-build-logs
        path: |
          *.log
          app/build/reports/

    - name: Alert Workflow Failure to Telegram
      if: failure()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        COMMIT_SHA=$(git rev-parse --short HEAD)
        python3 -c "
        import os, urllib.request, urllib.parse
        token = os.environ.get('TELEGRAM_BOT_TOKEN')
        chat_id = os.environ.get('TELEGRAM_CHAT_ID')
        sha = os.environ.get('COMMIT_SHA', '$(git rev-parse --short HEAD)')
        if not token or not chat_id:
            exit(0)
        
        log_files = ['cargo_build.log', 'gradle_build.log', 'gradle_lint.log', 'gradle_test.log']
        found_errs = []
        for lf in log_files:
            if os.path.exists(lf) and os.path.getsize(lf) > 0:
                with open(lf, 'r', errors='ignore') as f:
                    lines = f.readlines()
                errs = [l.strip() for l in lines if any(k in l for k in ['error[E', 'error:', 'CMake Error', 'FAILED:', 'undefined reference', 'cannot find', 'BUILD FAILED'])]
                if not errs:
                    errs = [l.strip() for l in lines[-12:] if l.strip()]
                if errs:
                    found_errs.append(f'[{lf}]\n' + '\n'.join(errs[-8:]))
        
        msg_text = f'🚨 CI Workflow Failed ({sha}):\n\n' + ('\n\n'.join(found_errs) if found_errs else 'No error log recorded')
        data = urllib.parse.urlencode({'chat_id': chat_id, 'text': msg_text[:3800]}).encode('utf-8')
        try:
            req = urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage', data=data)
            urllib.request.urlopen(req, timeout=10)
        except Exception as e:
            print(f'Telegram send error: {e}')
        "
